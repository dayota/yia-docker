version: 1
project:
  name: php-node

environment:
  domain: php-node.localhost
services:
  postgres:
    enabled: true
    version: "18"
applications:
  api:
    type: php
    path: apps/api
    runtime:
      php: "8.4"
    framework:
      name: laravel
    web:
      hostname: api.php-node.localhost
      public_directory: public
  frontend:
    type: node
    path: apps/frontend
    runtime:
      node: "24"
    framework:
      name: nuxt
    web:
      hostname: php-node.localhost
      port: 3000
