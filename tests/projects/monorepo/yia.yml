version: 1
project:
  name: monorepo
environment:
  domain: monorepo.localhost
services:
  postgres:
    enabled: true
    version: "18"
applications:
  api:
    type: php
    path: apps/api
    runtime:
      php: "8.4"
    framework:
      name: laravel
      version: 13
    web:
      hostname: api.monorepo.localhost
      public_directory: public
  legacy:
    type: php
    path: apps/legacy
    runtime:
      php: "8.2"
    framework:
      name: symfony
      version: "7.4"
    web:
      hostname: legacy.monorepo.localhost
      public_directory: public
  frontend:
    type: node
    path: apps/frontend
    runtime:
      node: "24"
    framework:
      name: nuxt
      version: 4
    web:
      hostname: monorepo.localhost
      port: 3000
  admin:
    type: node
    path: apps/admin
    runtime:
      node: "22"
    framework:
      name: nuxt
      version: 4
    web:
      hostname: admin.monorepo.localhost
      port: 3000
