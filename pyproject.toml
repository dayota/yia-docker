[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yia"
version = "0.1.0"
description = "Environnement de développement Docker composable et agent-friendly."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[project.scripts]
yia = "yia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/yia/schemas" = [
  "schemas/yia.schema.json",
  "schemas/yia-state.schema.json",
  "schemas/yia-generation-manifest.schema.json"
]
"share/yia/docker/apache" = [
  "docker/apache/Dockerfile",
  "docker/apache/yia-health.conf"
]
"share/yia/docker/php" = [
  "docker/php/default-pool.conf",
  "docker/php/entrypoint.sh",
  "docker/php/global.conf",
  "docker/php/xdebug.ini"
]
"share/yia/docker/php/8.2" = ["docker/php/8.2/Dockerfile"]
"share/yia/docker/php/8.4" = ["docker/php/8.4/Dockerfile"]
"share/yia/docker/node" = [
  "docker/node/develop.sh",
  "docker/node/entrypoint.sh",
  "docker/node/node-healthcheck.js"
]
"share/yia/docker/node/22" = ["docker/node/22/Dockerfile"]
"share/yia/docker/node/24" = ["docker/node/24/Dockerfile"]
"share/yia/templates/documentation" = [
  "templates/documentation/AGENTS.fragment.md",
  "templates/documentation/INDEX.md",
  "templates/documentation/glossary.md"
]
"share/yia/templates/documentation/decisions" = [
  "templates/documentation/decisions/README.md"
]
"share/yia/templates/skills/project-docs" = [
  "templates/skills/project-docs/SKILL.md"
]
"share/yia/templates/skills/update-project-docs" = [
  "templates/skills/update-project-docs/SKILL.md"
]
"share/yia/templates/project" = [
  "templates/project/.env.example",
  "templates/project/AGENTS.md",
  "templates/project/Makefile",
  "templates/project/yia.yml"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
